name: VAD checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          for file in frontend/*.js; do node --check "$file"; done
      - name: Run importer tests
        run: node --test tests/*.test.cjs
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run YAML converter tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check frontend bundle matches source
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('frontend')
          bundled=Path('custom_components/vad/frontend')
          for p in source.iterdir():
              if p.is_file():
                  assert (bundled/p.name).read_bytes()==p.read_bytes(), f'Stale bundle: {p.name}'
          PY
      - name: Compile integration
        run: python -m compileall -q custom_components/vad
      - name: Validate manifest and HACS metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/vad/manifest.json').read_text())
          assert manifest['domain'] == 'vad'
          assert manifest['version']
          assert json.loads(Path('hacs.json').read_text())['name']
          PY

      - name: Static distribution readiness gate
        run: python tools/release_gate.py
